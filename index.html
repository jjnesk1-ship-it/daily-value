<title>Daily Value</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800;900&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Daily Value: a nutrition tracker styled after the Nutrition Facts label.
     Heavy Franklin Gothic type and black rules for the chrome; color is kept for data. */
  :root {
    --paper: #f3f4f1;
    --surface: #ffffff;
    --surface-2: #f0f2ee;
    --surface-3: #e6e9e4;
    --ink: #131614;
    --ink-2: #4a514c;
    --ink-3: #6b736d;
    --line: #e2e5e0;
    --line-2: #cdd2cc;
    --track: #e8ebe6;
    --bar: #4f5751;
    --focus: #2a78d6;
    /* macros (validated categorical order) */
    --protein: #1baf7a;
    --carbs: #2a78d6;
    --fat: #eb6834;
    --alcohol: #4a3aa7;
    /* status (reserved meaning, always with an icon) */
    --good: #0ca30c;
    --warn: #fab219;
    --bad: #d03b3b;
    --good-ink: #006300;
    --warn-ink: #8a5a00;
    --bad-ink: #b42323;
    --shadow: 0 1px 2px rgba(19, 22, 20, 0.06), 0 8px 24px rgba(19, 22, 20, 0.1);
    --shadow-lg: 0 -4px 24px rgba(19, 22, 20, 0.12), 0 24px 64px rgba(19, 22, 20, 0.2);
    --font-display: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0c0e0d;
      --surface: #151816;
      --surface-2: #1c201e;
      --surface-3: #252a27;
      --ink: #eef1ee;
      --ink-2: #b9c0bb;
      --ink-3: #8c948e;
      --line: #262b28;
      --line-2: #373d39;
      --track: #262b28;
      --bar: #aab2ac;
      --focus: #6da7ec;
      --protein: #199e70;
      --carbs: #3987e5;
      --fat: #d95926;
      --alcohol: #9085e9;
      --good-ink: #2fbf2f;
      --warn-ink: #fab219;
      --bad-ink: #f07373;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 -4px 24px rgba(0, 0, 0, 0.4), 0 24px 64px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0c0e0d;
    --surface: #151816;
    --surface-2: #1c201e;
    --surface-3: #252a27;
    --ink: #eef1ee;
    --ink-2: #b9c0bb;
    --ink-3: #8c948e;
    --line: #262b28;
    --line-2: #373d39;
    --track: #262b28;
    --bar: #aab2ac;
    --focus: #6da7ec;
    --protein: #199e70;
    --carbs: #3987e5;
    --fat: #d95926;
    --alcohol: #9085e9;
    --good-ink: #2fbf2f;
    --warn-ink: #fab219;
    --bad-ink: #f07373;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 -4px 24px rgba(0, 0, 0, 0.4), 0 24px 64px rgba(0, 0, 0, 0.6);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.45 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .ic { flex: none; display: block; }
  .sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #app-loading { padding: 40px 16px; font: 800 20px/1.2 var(--font-display); }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
  .side { display: none; }
  .main { min-width: 0; padding-inline: 16px; padding-block: 12px calc(104px + env(safe-area-inset-bottom, 0px)); }
  .wrap { max-width: 1180px; margin-inline: auto; }
  .mhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 14px; }
  .mbrand { font: 900 21px/1 var(--font-display); letter-spacing: -0.025em; padding-bottom: 3px; border-bottom: 5px solid var(--ink); }
  .brand { font: 900 28px/0.95 var(--font-display); letter-spacing: -0.03em; padding-bottom: 10px; border-bottom: 10px solid var(--ink); }
  .brand small { display: block; margin-top: 8px; font: 700 11px/1.2 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .nav { display: grid; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 700; font-size: 14.5px; text-align: left; cursor: pointer; }
  .nav button:hover { background: var(--surface-2); color: var(--ink); }
  .nav button[aria-current="page"] { background: var(--ink); color: var(--surface); }
  .side-foot { margin-top: auto; display: grid; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .side-foot p { margin: 0; }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); min-width: 0; }
  .sync.s-error { color: var(--bad-ink); }
  .tabbar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tab { display: grid; justify-items: center; gap: 2px; padding: 4px 0; border: 0; background: none; color: var(--ink-3); font-size: 11px; font-weight: 700; cursor: pointer; }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab-add { justify-self: center; width: 56px; height: 56px; margin-top: -24px; border-radius: 50%; border: 4px solid var(--paper); background: var(--ink); color: var(--surface); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2); }
  @media (min-width: 960px) {
    .app { grid-template-columns: 236px minmax(0, 1fr); }
    .side { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 24px 16px 20px; background: var(--surface); border-right: 1px solid var(--line); }
    .main { padding-inline: 32px; padding-block: 28px 56px; }
    .mhead, .tabbar { display: none; }
  }

  .banner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 12px 16px; margin: 0 0 18px; }
  .banner p { margin: 0; font-size: 14px; max-width: 72ch; }
  .toasts { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px)); display: grid; gap: 8px; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--surface); padding: 11px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); animation: rise 0.2s ease-out; }
  .toast button { margin-left: auto; background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }
  @media (min-width: 960px) { .toasts { bottom: 24px; } }

  /* ---------- Controls ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; position: relative; text-decoration: none; }
  .btn:hover { background: var(--surface-2); }
  label.btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn-primary:hover { background: var(--ink); opacity: 0.88; }
  .btn-invert { background: var(--surface); border-color: var(--surface); color: var(--ink); }
  .btn-invert:hover { background: var(--surface); opacity: 0.9; }
  .btn-quiet { border-color: transparent; background: transparent; }
  .btn-quiet:hover { background: var(--surface-2); }
  .btn-sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
  .btn-block { width: 100%; }
  .btn-grow { flex: 1; }
  .btn-danger { color: var(--bad-ink); }
  .btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.fav.on { background: var(--surface-2); }
  .iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; flex: none; padding: 0; }
  .iconbtn:hover { background: var(--surface-2); }
  .iconbtn.quiet { border-color: transparent; background: transparent; }
  .iconbtn.quiet:hover { background: var(--surface-2); }
  .iconbtn.sm { width: 30px; height: 30px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 700; font-size: 13.5px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; justify-self: start; }
  .input { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1.3; }
  .input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .input[disabled] { opacity: 0.6; }
  textarea.input { resize: vertical; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; }
  @media (min-width: 960px) { .input { font-size: 15px; } }
  .field { display: grid; gap: 6px; min-width: 0; align-content: start; }
  .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
  .hint { font-size: 12px; color: var(--ink-3); }
  .inline-field { display: inline-flex; align-items: center; gap: 6px; }
  .inline-field .input { width: 112px; }
  .inline-field .input.sm { width: 92px; min-height: 34px; padding: 4px 8px; font-size: 14px; }
  .unit { font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; max-width: 100%; justify-self: start; }
  .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-family: var(--font-body); font-weight: 700; font-size: 13.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14), 0 0 0 1px var(--line); }
  .seg.small button { padding: 6px 10px; font-size: 13px; }
  .chips, .quick-amts { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .chip:hover { background: var(--surface-2); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
  .check input { width: 18px; height: 18px; accent-color: var(--ink); }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); display: inline-block; animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Layout helpers ---------- */
  .stack { display: grid; gap: 14px; }
  .row { display: flex; align-items: center; }
  .gap8 { gap: 8px; }
  .wrap { flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grid2, .grid3, .grid4 { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 640px) {
    .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  .span2 { grid-column: span 2; }
  .span3 { grid-column: 1 / -1; }
  .top8 { margin-top: 8px; }
  .top16 { margin-top: 16px; }
  .muted { color: var(--ink-3); }
  .small { font-size: 13px; }
  .pad { padding: 16px 4px; }
  .lede { font-size: 15.5px; margin: 0; }
  .error { display: flex; gap: 6px; align-items: flex-start; color: var(--bad-ink); font-weight: 600; font-size: 14px; margin: 8px 0 0; }
  .warn-note { display: flex; gap: 6px; align-items: flex-start; color: var(--warn-ink); font-size: 13px; font-weight: 600; margin: 0; }
  .good-note { display: flex; align-items: center; gap: 6px; color: var(--good-ink); font-weight: 600; font-size: 14px; }
  .empty { padding: 18px 4px; margin: 0; }
  .empty p { margin: 0 0 6px; }
  .view-h { margin: 0 0 18px; }
  .view-h h1 { margin: 0; font: 900 34px/1.05 var(--font-display); letter-spacing: -0.025em; }
  .view-h p { margin: 4px 0 0; }
  .h2 { margin: 0 0 12px; font: 800 20px/1.2 var(--font-display); letter-spacing: -0.01em; }
  .sec-h { font: 800 13px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 3px solid var(--ink); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .pad-panel { padding: 16px; }
  .panel-h { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 14px 16px 10px; border-bottom: 2px solid var(--ink); }
  .panel-h h2 { margin: 0; font: 800 20px/1.2 var(--font-display); letter-spacing: -0.01em; }
  .panel-sub { font-size: 13px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .footnote { font-size: 12.5px; color: var(--ink-3); margin: 0; padding: 0 16px 14px; }
  .report .footnote { padding: 12px 0 0; }

  /* ---------- Diary ---------- */
  .datebar { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; }
  .datebar-t { flex: 1; min-width: 0; text-align: center; }
  .datebar h1 { margin: 0; font: 900 30px/1.05 var(--font-display); letter-spacing: -0.025em; }
  .datebar .sub { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
  .datepick { position: relative; overflow: hidden; }
  .datepick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .date-in { display: none; width: auto; min-height: 38px; padding: 4px 10px; font-size: 14px; }
  @media (min-width: 960px) {
    .datebar-t { flex: 1; order: -1; text-align: left; }
    .datebar h1 { font-size: 36px; }
    .datepick { display: none; }
    .date-in { display: block; }
  }
  .diary-top { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .area-side { order: -1; min-width: 0; }
  .area-main { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .area-nutrients { margin-top: 16px; }
  @media (min-width: 1080px) {
    .diary-top { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
    .area-side { order: 0; position: sticky; top: 20px; }
  }

  /* The Nutrition Facts label, used for the day summary and every food */
  .factlabel { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); padding: 6px 9px 9px; font-family: var(--font-display); min-width: 0; }
  .factlabel .btn { font-family: var(--font-body); }
  .fl-title { font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: -0.025em; margin: 0 0 3px; }
  .fl-serv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 1px solid var(--ink); padding-top: 3px; font-size: 14px; font-weight: 500; }
  .fl-serv b { font-weight: 800; text-align: right; }
  .rule-xl { height: 10px; background: var(--ink); margin: 3px 0; }
  .rule-l { height: 5px; background: var(--ink); margin: 3px 0 0; }
  .rule { height: 1px; background: var(--ink); margin: 8px 0 6px; }
  .fl-per { font-size: 13px; font-weight: 800; }
  .fl-sub { font-size: 13px; font-weight: 800; }
  .fl-cal { display: flex; justify-content: space-between; align-items: flex-end; line-height: 1; }
  .fl-cal b { font-size: 26px; font-weight: 900; }
  .fl-cal .n { font-size: 42px; font-weight: 900; letter-spacing: -0.025em; }
  .lrow { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--ink); padding: 2px 0; font-size: 14px; font-weight: 500; }
  .lrow b { font-weight: 800; }
  .lrow.indent { padding-left: 16px; }
  .lrow.head { border-top: 0; font-size: 12.5px; font-weight: 800; padding: 1px 0 0; }
  .rule-l + .lrow { border-top: 0; }
  .lrow .dv { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fl-foot { font-family: var(--font-body); font-size: 12px; color: var(--ink-2); padding-top: 6px; display: grid; gap: 6px; }
  .fl-foot p { margin: 0; }
  .hero { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .hero-num { font-weight: 900; font-size: 58px; line-height: 0.95; letter-spacing: -0.035em; }
  .hero.is-over .hero-num { color: var(--bad-ink); }
  .eq { display: flex; flex-wrap: wrap; gap: 3px 8px; font-family: var(--font-body); font-size: 13px; color: var(--ink-2); margin: 8px 0 4px; }
  .eq b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .macro { padding: 7px 0 6px; border-top: 1px solid var(--ink); }
  .rule-l + .macro { border-top: 0; }
  .macro-h { display: flex; align-items: center; gap: 8px; font-size: 14.5px; margin-bottom: 6px; }
  .macro-h b { font-weight: 800; }
  .macro-amt { margin-left: auto; font-family: var(--font-body); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .macro-h .dv { font-weight: 800; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  .sw-ink { background: var(--bar); }
  .review-btn { margin-top: 12px; }

  .meter { position: relative; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--bar); border-radius: 3px; transition: width 0.3s ease; }
  .meter.thick { height: 12px; border-radius: 2px; }
  .meter.thick > i { border-radius: 2px; }
  .meter > i.s-met { background: var(--good); }
  .meter > i.s-over { background: var(--bad); }
  .meter > i.s-high { background: var(--warn); }
  .meter-none { display: block; height: 6px; }
  .split { display: flex; gap: 2px; border-radius: 3px; overflow: hidden; margin: 7px 0 8px; }
  .split > i { display: block; height: 100%; min-width: 2px; }
  .split.empty { background: var(--track); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-body); font-size: 12.5px; color: var(--ink-2); }
  .legend.small { font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  .key.line { width: 14px; height: 3px; border-radius: 2px; }
  .mark { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; flex: none; }
  .mark.good { color: var(--good-ink); }
  .mark.bad { color: var(--bad-ink); }
  .mark.warn { color: var(--warn-ink); }

  .meal + .meal { border-top: 1px solid var(--line); }
  .meal-h { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 6px; }
  .meal-h h3 { margin: 0; flex: 1; font: 800 19px/1.2 var(--font-display); letter-spacing: -0.015em; }
  .meal-macros { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meal-kcal { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; row-gap: 1px; width: 100%; padding: 8px 16px; border: 0; background: none; text-align: left; cursor: pointer; }
  .entry:hover { background: var(--surface-2); }
  .entry-name { font-weight: 600; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .entry-meta { font-size: 12.5px; color: var(--ink-3); }
  .entry-kcal { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meal-add { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 10px 10px; }

  /* ---------- Sheets ---------- */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 11, 0.5); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.15s ease-out; }
  .sheet { width: 100%; max-height: calc(100% - 12px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); animation: rise 0.2s ease-out; outline: none; padding-bottom: env(safe-area-inset-bottom, 0px); }

  @keyframes fade { from { opacity: 0; } }

  .contrib, .topfoods { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  .contrib .nm, .topfoods .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Foods, trends, profile ---------- */
  .about-data { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-top: 16px; }
